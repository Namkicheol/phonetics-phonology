<script>
const SAVE_KEY='ox_phon_del_v1';
const TOTAL=15;
let cur=0,answers=new Array(TOTAL).fill(null);
function getScore(){return answers.filter(a=>a&&a.correct).length;}
const Q=[
  {
    "src": "Deletion",
    "cat": "Coronal Stop — best man",
    "text": "\"best man\"에서 /t/가 탈락하면 <span class='kw1'>[bɛs mæn]</span>이다.",
    "ans": true,
    "correct": "정확하다. 'best man'에서 /t/는 /s-t-m/의 central /t/이므로 탈락하여 [bɛs mæn]이 될 수 있다.",
    "why": "Coronal stop deletion에서 /t,d/는 three-consonant sequence의 가운데에 있을 때 삭제될 수 있다. best man의 /s t m/에서 /t/를 삭제하면 [bɛs mæn]이 된다. 이 발음이 가능하다는 뜻이며 반드시 삭제해야 한다는 뜻은 아니다.",
    "source": "Mehmet Yavaş, Applied English Phonology, 2nd ed. (2011), Ch. 6 §6.5.6.",
    "compare": [
      {
        "title": "best man → [bɛs mæn]",
        "desc": "/s-t-m/의 central /t/ 탈락"
      },
      {
        "title": "old friend → [oʊl frɛnd]",
        "desc": "word-final cluster의 final /d/ 탈락"
      }
    ]
  },
  {
    "src": "Deletion",
    "cat": "Coronal Stop — 환경",
    "text": "이 페이지의 coronal stop deletion에서 삭제 대상 /t,d/는 앞뒤에 consonant가 있는 위치에 놓인다.",
    "ans": true,
    "correct": "정확하다. 다만 target /t,d/는 three-consonant sequence의 central position이거나, word-final cluster의 final segment여야 한다.",
    "why": "best man의 /s t m/과 old friend의 /l d f/를 비교하면 가운데 /t,d/가 삭제 대상이다. 다만 모든 C __ C에 의무적으로 적용되는 것은 아니다. 이 페이지의 기본 예에서는 다음 단어가 /h,j,w,r/로 시작하는 경우를 제외하며, /l/ 앞의 hand luggage는 유지와 삭제를 모두 허용한다. 이 제한을 모든 방언에 확대하지 않는다. grammatical ending이 만든 cluster는 유지되는 경향이 있다.",
    "source": "Mehmet Yavaş, Applied English Phonology, 2nd ed. (2011), Ch. 6 §6.5.6.",
    "compare": [
      {
        "title": "best man",
        "desc": "/s t m/ → [s m]: 가운데 /t/ 삭제 가능"
      },
      {
        "title": "best offer",
        "desc": "다음 segment가 vowel: 이 cluster rule의 환경이 아님"
      }
    ]
  },
  {
    "src": "Deletion",
    "cat": "H-deletion — 적용 범위",
    "text": "비강세 function word의 어두 /h/에 적용하는 deletion rule은 hero와 happy의 /h/에도 적용된다.",
    "ans": false,
    "correct": "틀렸다. 이 규칙은 connected speech에서 비강세 function word의 어두 /h/를 대상으로 한다.",
    "why": "him, her, have 같은 function word가 비강세로 쓰일 때 어두 /h/가 탈락할 수 있다. Hero와 happy에는 이 조건이 성립하지 않는다. 별도의 word-medial /h/-deletion까지 부정하는 설명으로 일반화하면 안 된다.",
    "source": "Mehmet Yavaş, Applied English Phonology, 2nd ed. (2011), §4.10 (strong/weak forms of function words).",
    "compare": [
      {
        "title": "기능어 — /h/ 탈락",
        "desc": "him → [ɪm], her → [ər] · 비강세 어두 /h/"
      },
      {
        "title": "내용어 — /h/ 유지",
        "desc": "hero, happy · stressed content word의 word-initial /h/에는 이 weak-form rule을 적용하지 않음"
      }
    ]
  },
  {
    "src": "Deletion",
    "cat": "Coronal Stop — old friend",
    "text": "\"old friend\"에서 <span class='kw1'>/d/</span>가 탈락할 수 있다.",
    "ans": true,
    "correct": "정확하다. 'old friend'의 word-final /d/ 뒤에 /f/가 오므로 /d/가 탈락할 수 있다.",
    "why": "old friend의 /d/는 /ld/의 마지막 segment이고 다음 /f/와 만나 /l d f/를 이룬다. /d/를 삭제한 [oʊl frɛnd]가 가능하다. 반드시 삭제해야 하는 것은 아니며 [d]가 유지된 발음도 있다. 반대로 old age에는 다음 consonant가 없으므로 이 cluster rule을 그대로 적용할 수 없다.",
    "source": "Mehmet Yavaş, Applied English Phonology, 2nd ed. (2011), Ch. 6 §6.5.6.",
    "compare": [
      {
        "title": "old friend → [oʊl frɛnd]",
        "desc": "word-final /ld/ + /f/ → final /d/ 탈락"
      },
      {
        "title": "old man → [oʊl mæn]",
        "desc": "word-final /ld/ + /m/ → final /d/ 탈락"
      }
    ]
  },
  {
    "src": "Deletion",
    "cat": "Coronal Stop — 어두 /t/",
    "text": "top과 time의 word-initial /t/는 이 페이지의 coronal stop deletion으로 삭제된다.",
    "ans": false,
    "correct": "틀렸다. 어두 /t/는 three-consonant sequence의 central segment도, word-final cluster의 final segment도 아니다.",
    "why": "top과 time의 word-initial /t/ 앞에는 consonant가 없다. 따라서 이 페이지에서 다루는 cluster의 가운데 /t,d/에 해당하지 않으며, 이 coronal stop deletion의 적용을 받지 않는다.",
    "source": "Mehmet Yavaş, Applied English Phonology, 2nd ed. (2011), Ch. 6 §6.5.6.",
    "compare": [
      {
        "title": "어두 /t/ → 탈락 없음",
        "desc": "규칙의 target position 불충족 · 'top', 'time'"
      },
      {
        "title": "central /t/ → 탈락 가능",
        "desc": "best man, last night"
      }
    ]
  },
  {
    "src": "Deletion",
    "cat": "H-deletion — help him",
    "text": "\"help him\"에서 /h/가 탈락하면 <span class='kw1'>[hɛlp ɪm]</span>이다.",
    "ans": true,
    "correct": "정확하다. 'him'의 비강세 어두 /h/가 탈락하면 [ɪm]이 된다.",
    "why": "help him에서 him이 unstressed weak form [ɪm]으로 쓰이면 [hɛlp ɪm]이 된다. help의 /h/는 그대로 남는다. HIM을 대조하여 강조하면 strong form [hɪm]을 쓰므로 같은 삭제를 적용하지 않는다. /h/가 반복된다는 이유로 하나를 지우는 규칙이 아니다.",
    "source": "Mehmet Yavaş, Applied English Phonology, 2nd ed. (2011), §4.10 (strong/weak forms of function words).",
    "compare": [
      {
        "title": "help him → [hɛlp ɪm]",
        "desc": "him의 /h/ 탈락 · connected speech"
      },
      {
        "title": "help Henry",
        "desc": "content word의 /h/에 일반화하지 않음"
      }
    ]
  },
  {
    "src": "Deletion",
    "cat": "H-deletion — 강세 위치",
    "text": "Function word의 어두 /h/는 그 단어가 contrastive stress를 받아도 같은 방식으로 탈락한다.",

function renderExp(q,isCorrect){
  const three=q.compare&&q.compare.length===3;
  const cmp=q.compare?`<div class="sec-label">📊 비교 정리</div><div class="compare${three?' three':''}">${q.compare.map(c=>`<div class="compare-item"><div class="ci-title">${c.title}</div><p>${c.desc}</p></div>`).join('')}</div>`:'';
  return `<div class="exp show"><div class="exp-header"><span>${isCorrect?'✅ 정답':'❌ 오답'} · 해설</span></div><div class="exp-answer"><div class="ans-label">핵심 정정</div><div class="ans-text">${q.correct}</div></div><div class="exp-body"><div class="sec-label">📖 상세 설명</div><p>${q.why}</p><div class="sec-label">📌 Source</div><div class="def-box"><p>${q.source}</p></div>${cmp}</div></div>`;
}
function renderNav(){
  document.getElementById('nav').innerHTML=answers.map((a,i)=>{
    let cls='nd';
    if(i===cur)cls+=' cur';
    else if(a!==null)cls+=a.correct?' ok':' ng';
    return `<button class="${cls}" onclick="jumpTo(${i})">${i+1}</button>`;
  }).join('');
}
function render(){
  if(cur>=TOTAL){
    document.getElementById('qa').style.display='none';
    document.getElementById('sc').classList.add('show');
    const s=getScore();
    document.getElementById('fs').textContent=s;
    const p=s/TOTAL;
    document.getElementById('rm').textContent=p===1?'🎉 Perfect!':p>=.8?'👏 Great!':p>=.6?'😊 Good!':'💪 Keep going!';
    document.getElementById('rs').textContent=`${TOTAL}문제 중 ${s}문제 정답 (${Math.round(p*100)}%)`;
    quizOrder.resultLater(function(){if(cur>=TOTAL)window.showScorePopup&&window.showScorePopup(s,TOTAL);});
    renderNav();return;
  }
  document.getElementById('sc').classList.remove('show');
  document.getElementById('qa').style.display='block';
  renderNav();
  const q=Q[cur];
  document.getElementById('bf').style.width=((cur+1)/TOTAL*100).toFixed(1)+'%';
  document.getElementById('pt').textContent=`${cur+1} / ${TOTAL}`;
  document.getElementById('ps').textContent=`정답 ${getScore()}개`;
  const a=answers[cur];
  if(a!==null){
    let oBtnCls='',xBtnCls='';
    if(a.picked===true){oBtnCls=a.correct?'co':'wp';if(!a.correct)xBtnCls='cx';}
    else{xBtnCls=a.correct?'cx':'wp';if(!a.correct)oBtnCls='co';}
    document.getElementById('qa').innerHTML=`<div class="card"><div class="q-meta"><span class="q-num">Q${cur+1}</span><span class="q-src">${q.src}</span><span class="q-cat">${q.cat}</span></div><div class="q-text">${q.text}</div><div class="ox-btns"><button class="ox-btn o-btn ${oBtnCls}" disabled>⭕<span class="lb">CORRECT</span></button><button class="ox-btn x-btn ${xBtnCls}" disabled>❌<span class="lb">WRONG</span></button></div><div class="badge ${a.correct?'ok':'ng'}">${a.correct?'✅ 정답!':'❌ 오답! 정답은 '+(q.ans?'O':'X')}</div><div>${renderExp(q,a.correct)}</div><button class="next-btn show" onclick="next()">${cur<TOTAL-1?'Next →':'결과 보기 →'}</button></div>`;
  }else{
    document.getElementById('qa').innerHTML=`<div class="card"><div class="q-meta"><span class="q-num">Q${cur+1}</span><span class="q-src">${q.src}</span><span class="q-cat">${q.cat}</span></div><div class="q-text">${q.text}</div><div class="ox-btns"><button class="ox-btn o-btn" onclick="pick(true)" id="ob">⭕<span class="lb">CORRECT</span></button><button class="ox-btn x-btn" onclick="pick(false)" id="xb">❌<span class="lb">WRONG</span></button></div><div id="bd" class="badge"></div><div id="ep"></div><button class="next-btn" id="nb" onclick="next()">${cur<TOTAL-1?'Next →':'결과 보기 →'}</button></div>`;
  }
}
function pick(val){
  const q=Q[cur];
  document.getElementById('ob').disabled=true;
  document.getElementById('xb').disabled=true;
  const ok=val===q.ans;
  answers[cur]={picked:val,correct:ok};
  if(ok){if(typeof playOk==='function')playOk();}else{if(typeof playNg==='function')playNg();}
  const bd=document.getElementById('bd');
  bd.textContent=ok?'✅ 정답!':`❌ 오답! 정답은 ${q.ans?'O':'X'}`;
  bd.className='badge '+(ok?'ok':'ng');
  document.getElementById(val?'ob':'xb').classList.add(ok?(val?'co':'cx'):'wp');
  if(!ok)document.getElementById(q.ans?'ob':'xb').classList.add(q.ans?'co':'cx');
  document.getElementById('ep').innerHTML=renderExp(q,ok);
  document.getElementById('nb').classList.add('show');
  document.getElementById('ps').textContent=`정답 ${getScore()}개`;
  renderNav();saveProgress();
}
function next(){cur++;saveProgress();render();}
function jumpTo(i){cur=i;render();document.getElementById('qa').scrollIntoView({behavior:'smooth',block:'start'});}
function saveProgress(){quizOrder.save({cur,answers});}
function freshStart(){quizOrder.reset();cur=0;answers=new Array(TOTAL).fill(null);document.getElementById('rb').style.display='none';document.getElementById('sc').classList.remove('show');document.getElementById('qa').style.display='block';renderNav();render();saveProgress();}
const quizOrder=QuizOrder.create(Q,{saveKey:SAVE_KEY,restart:freshStart});
(function(){
  const saved=quizOrder.progress;
  if(saved&&saved.answers&&saved.cur>=0&&saved.cur<TOTAL){
    cur=saved.cur;answers=saved.answers;
    const done=answers.filter(a=>a!==null).length;
    if(done>0){document.getElementById('rb-msg').textContent=`이어서 풀기 중 · ${done}/${TOTAL} 문제 완료 (정답 ${getScore()}개)`;document.getElementById('rb').style.display='block';}
  }
  renderNav();render();saveProgress();
})();
</script>
