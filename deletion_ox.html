<script>
const SAVE_KEY='ox_phon_del_v1';
const TOTAL=15;
let cur=0,answers=new Array(TOTAL).fill(null);
function getScore(){return answers.filter(a=>a&&a.correct).length;}
const Q=[
  {src:"Deletion",cat:"Coronal Stop — best man",text:"\"best man\"에서 /t/가 탈락하면 <span class='kw1'>[bes mæn]</span>이다.",ans:true,correct:"정확하다. 'best man'에서 /t/는 /s-t-m/의 central /t/이므로 탈락하여 [bes mæn]이 될 수 있다.",why:"Coronal stop deletion에서 /t,d/는 three-consonant sequence의 central position에 있을 때 탈락할 수 있습니다. 'best man'의 /t/는 /s-t-m/에서 central /t/이므로 환경을 충족합니다. 결과: [bes mæn].",source:"AEP Ch. 6 §6.5.6 (final-cluster deletion); Phonological Rules_가루미 §3 (Segment Deletion)",compare:[{title:"best man → [bes mæn]",desc:"/s-t-m/의 central /t/ 탈락"},{title:"old friend → [oʊl frɛnd]",desc:"word-final cluster의 final /d/ 탈락"}]},
  {src:"Deletion",cat:"Coronal Stop — 환경",text:"<span class='kw1'>/t,d/ 탈락</span>은 두 자음 사이에서 일어난다.",ans:true,correct:"정확하다. 다만 target /t,d/는 three-consonant sequence의 central position이거나, word-final cluster의 final segment여야 한다.",why:"/t,d/ deletion은 단순히 모든 C __ C에 일반화하지 않습니다. (1) three-consonant sequence에서 target이 central position에 있거나, (2) word-final cluster의 final /t,d/ 뒤에 다음 단어의 consonant가 와야 합니다. 두 번째 경우 다음 consonant가 /h, y, w, r/이면 적용하지 않습니다. 다음 consonant가 liquid이면 deletion은 optional이고, grammatical ending이 붙은 경우에는 deletion이 훨씬 덜 일어납니다.",source:"AEP Ch. 6 §6.5.6 (final-cluster deletion); Phonological Rules_가루미 §3 (Segment Deletion)",compare:[{title:"환경 충족",desc:"central /t,d/ in three-consonant sequence; word-final cluster + C"},{title:"환경 불충족",desc:"어두 / 모음 사이; word-boundary 다음 /h, y, w, r/"}]},
  {src:"Deletion",cat:"H-deletion — 적용 범위",text:"<span class='kw1'>/h/ 탈락</span>은 내용어(content word: hero, happy)에도 적용된다.",ans:false,correct:"틀렸다. /h/ 탈락은 <span class='kw2'>기능어(function word)</span>의 비강세 어두 /h/에만 적용된다. 내용어는 해당 없다.",why:"H-deletion(H 탈락)은 him, her, he, his, have, has, had 등 기능어(function word)의 비강세 어두 /h/에만 적용됩니다. 'hero', 'happy' 같은 내용어(content word)는 /h/가 강세를 받으므로 탈락하지 않습니다.",source:"AEP Ch. 6 §6.5.6 (final-cluster deletion); Phonological Rules_가루미 §3 (Segment Deletion)",compare:[{title:"기능어 — /h/ 탈락",desc:"him → [ɪm], her → [ər] · 비강세 어두 /h/"},{title:"내용어 — /h/ 유지",desc:"hero, happy · 강세 /h/ 탈락 안 됨"}]},
  {src:"Deletion",cat:"Coronal Stop — old friend",text:"\"old friend\"에서 <span class='kw1'>/d/</span>가 탈락할 수 있다.",ans:true,correct:"정확하다. 'old friend'의 word-final /d/ 뒤에 /f/가 오므로 /d/가 탈락할 수 있다.",why:"'old friend'[oʊld frɛnd]에서 /d/는 word-final cluster /ld/의 final segment이고, 다음 단어가 consonant /f/로 시작합니다. /f/는 /h, y, w, r/ 예외가 아니므로 /d/ deletion이 가능해 [oʊl frɛnd]가 됩니다. 이는 optional deletion입니다.",source:"AEP Ch. 6 §6.5.6 (final-cluster deletion); Phonological Rules_가루미 §3 (Segment Deletion)",compare:[{title:"old friend → [oʊl frɛnd]",desc:"word-final /ld/ + /f/ → final /d/ 탈락"},{title:"old man → [oʊl mæn]",desc:"word-final /ld/ + /m/ → final /d/ 탈락"}]},
  {src:"Deletion",cat:"Coronal Stop — 어두 /t/",text:"어두 <span class='kw4'>/t/</span>는 탈락 규칙의 적용을 받는다.",ans:false,correct:"틀렸다. 어두 /t/는 three-consonant sequence의 central segment도, word-final cluster의 final segment도 아니다.",why:"어두(word-initial) /t/는 central /t,d/ in a three-consonant sequence도, word-final cluster의 final /t,d/도 아닙니다. 따라서 'top', 'time' 같은 어두 /t/는 이 deletion rule의 적용을 받지 않습니다.",source:"AEP Ch. 6 §6.5.6 (final-cluster deletion); Phonological Rules_가루미 §3 (Segment Deletion)",compare:[{title:"어두 /t/ → 탈락 없음",desc:"규칙의 target position 불충족 · 'top', 'time'"},{title:"central /t/ → 탈락 가능",desc:"best man, last night"}]},
  {src:"Deletion",cat:"H-deletion — help him",text:"\"help him\"에서 /h/가 탈락하면 <span class='kw1'>[hɛlp ɪm]</span>이다.",ans:true,correct:"정확하다. 'him'의 비강세 어두 /h/가 탈락하면 [ɪm]이 된다.",why:"'him'은 pronominal function word이며 connected speech에서 비강세 initial /h/가 탈락할 수 있습니다. 이 예는 <em>Phonological Rules_가루미</em>의 h-deletion 예시와 일치합니다.",source:"Phonological Rules_가루미 §3 ⑪ /h/-Deletion",compare:[{title:"help him → [hɛlp ɪm]",desc:"him의 /h/ 탈락 · connected speech"},{title:"help Henry",desc:"content word의 /h/에 일반화하지 않음"}]},
  {src:"Deletion",cat:"H-deletion — 강세 위치",text:"<span class='kw1'>/h/ 탈락</span>은 강세 위치에서도 일어난다.",ans:false,correct:"틀렸다. /h/ 탈락은 <span class='kw2'>비강세(unstressed)</span> 어두에서만 일어난다. 강세를 받는 /h/는 탈락하지 않는다.",why:"H-deletion의 핵심 조건: '비강세 어두 /h/'입니다. 기능어더라도 문장에서 강세를 받는 경우(예: 대조 강세)에는 /h/가 탈락하지 않습니다. 강세가 없는 비강세 위치의 /h/만 탈락 규칙의 적용을 받습니다.",source:"AEP Ch. 6 §6.5.6 (final-cluster deletion); Phonological Rules_가루미 §3 (Segment Deletion)",compare:[{title:"비강세 /h/ → 탈락",desc:"him → [ɪm], her → [ər]"},{title:"강세 /h/ → 유지",desc:"HIM (대조 강세) → [hɪm]"}]},
  {src:"Deletion",cat:"Coronal Stop — 정의",text:"<span class='kw1'>Coronal stop deletion</span>은 자음 사이에 낀 /t,d/를 삭제한다.",ans:true,correct:"정확하다. Coronal stop deletion의 target은 three-consonant sequence의 central /t,d/ 또는 word-final cluster의 final /t,d/다.",why:"Coronal stop deletion은 /t/와 /d/가 (1) three-consonant sequence의 central position에 있거나, (2) word-final cluster의 final member로서 다음 word-initial consonant 앞에 있을 때 일어날 수 있습니다. 두 번째 환경은 다음 consonant /h, y, w, r/ 앞에서는 적용하지 않으며, liquid 앞에서는 optional입니다. grammatical ending이 붙은 경우에는 deletion이 훨씬 덜 일어납니다.",source:"AEP Ch. 6 §6.5.6 (final-cluster deletion); Phonological Rules_가루미 §3 (Segment Deletion)",compare:[{title:"/t/ 탈락 예",desc:"best man, last night, west side"},{title:"/d/ 탈락 예",desc:"old friend, cold beer, bold move"}]},
  {src:"Deletion",cat:"H-deletion — ask her",text:"\"ask her\"에서 /h/가 탈락하면 <span class='kw1'>[æsk ər]</span>이다.",ans:true,correct:"정확하다. 'her'의 비강세 어두 /h/가 탈락하면 [ər]이 된다.",why:"'her'는 pronominal function word이며 connected speech에서 비강세 initial /h/가 탈락할 수 있습니다. 이 예는 <em>Phonological Rules_가루미</em>의 h-deletion 예시와 일치합니다.",source:"Phonological Rules_가루미 §3 ⑪ /h/-Deletion",compare:[{title:"ask her → [æsk ər]",desc:"her의 /h/ 탈락 · connected speech"},{title:"ask Helen",desc:"content word의 /h/에 일반화하지 않음"}]},
  {src:"Deletion",cat:"Coronal Stop — 탈락 후",text:"/t,d/ 탈락 후 남은 두 자음은 직접 연결된다.",ans:true,correct:"정확하다. /t,d/ 탈락 후 앞뒤 자음이 바로 인접하게 되어 자음군을 이룬다.",why:"Coronal stop deletion으로 중간의 /t/ 또는 /d/가 사라지면, 앞뒤 자음이 직접 연결됩니다. 예: 'best man'[bes mæn]에서 /s/와 /m/이 바로 인접. 'old friend'[oʊl frɛnd]에서 /l/과 /f/가 인접합니다.",source:"AEP Ch. 6 §6.5.6 (final-cluster deletion); Phonological Rules_가루미 §3 (Segment Deletion)",compare:[{title:"before: [bɛst mæn]",desc:"s-t-m 연속 · /t/ 있음"},{title:"after: [bɛs mæn]",desc:"s-m 직접 연결 · /t/ 탈락"}]},
  {src:"Deletion",cat:"H-deletion — 정의",text:"<span class='kw1'>/h/ 탈락</span>은 기능어의 비강세 어두 /h/에 적용된다.",ans:true,correct:"정확하다. H-deletion의 적용 조건: (1) 기능어(function word), (2) 비강세(unstressed), (3) 어두(word-initial) /h/.",why:"H-deletion의 세 가지 조건: 첫째 기능어(him, her, he, his, have, has, had 등), 둘째 해당 /h/가 비강세, 셋째 어두 위치. 이 세 조건을 모두 충족할 때만 /h/ 탈락이 적용됩니다.",source:"AEP Ch. 6 §6.5.6 (final-cluster deletion); Phonological Rules_가루미 §3 (Segment Deletion)",compare:[{title:"H-deletion 조건 1",desc:"기능어 · him, her, he, his"},{title:"H-deletion 조건 2",desc:"비강세 + 어두 · unstressed initial /h/"}]},
  {src:"Deletion",cat:"Coronal Stop — last night",text:"\"last night\"에서 <span class='kw1'>/t/ 탈락</span>이 가능하다.",ans:true,correct:"정확하다. 'last night'의 /t/는 /s-t-n/의 central /t/이므로 탈락할 수 있다.",why:"'last night'[læst naɪt]에서 /t/는 /s-t-n/ three-consonant sequence의 central segment입니다. 이 환경을 충족하므로 /t/ deletion이 가능해 [læs naɪt]가 됩니다. 구어 연속 발화에서는 optional입니다.",source:"AEP Ch. 6 §6.5.6 (final-cluster deletion); Phonological Rules_가루미 §3 (Segment Deletion)",compare:[{title:"last night → [læs naɪt]",desc:"/s-t-n/의 central /t/ 탈락"},{title:"best man → [bɛs mæn]",desc:"/s-t-m/의 central /t/ 탈락"}]},
  {src:"Deletion",cat:"의무성 — 방언 차이",text:"/t,d/ 탈락은 모든 영어 방언에서 <span class='kw4'>의무적으로</span> 일어난다.",ans:false,correct:"틀렸다. /t,d/ 탈락은 <span class='kw2'>선택적(optional)</span> 규칙이다. 방언과 발화 속도, 격식도에 따라 적용 여부가 다르다.",why:"Coronal stop deletion은 obligatory(의무적) 규칙이 아니라 optional(선택적) 규칙입니다. 적용 환경은 central /t,d/ in a three-consonant sequence 또는 word-final cluster의 final /t,d/ before a following consonant이며, liquid 앞에서는 특히 optional입니다. grammatical ending이 붙은 경우에는 deletion이 훨씬 덜 일어납니다.",source:"AEP Ch. 6 §6.5.6 (final-cluster deletion); Phonological Rules_가루미 §3 (Segment Deletion)",compare:[{title:"Optional rule",desc:"선택적 · 속도/격식도에 따라 달라짐"},{title:"Obligatory rule",desc:"의무적 · 항상 적용 · 환경만 충족하면"}]},
  {src:"Deletion",cat:"규칙 지위",text:"탈락 규칙(deletion rule)은 <span class='kw1'>phonological rule</span>이다.",ans:true,correct:"정확하다. Coronal stop deletion과 H-deletion 모두 phonological rule(음운 규칙)이다.",why:"탈락 규칙들은 예측 가능한 environment에 따라 적용되는 phonological rule입니다. Coronal stop deletion은 central /t,d/ in a three-consonant sequence 또는 제한된 word-boundary environment에 적용되며, H-deletion은 unstressed word-initial /h/ in function words에 적용됩니다. 단순한 발음 실수가 아니라 체계적인 음운 과정입니다.",source:"AEP Ch. 6 §6.5.6 (final-cluster deletion); Phonological Rules_가루미 §3 (Segment Deletion)",compare:[{title:"Phonological rule",desc:"체계적 · 환경 조건부 · 예측 가능"},{title:"Random error",desc:"비체계적 · 예측 불가 · 음운 규칙 아님"}]},
  {src:"Deletion",cat:"Schwa deletion — stress environment",text:"fast speech에서 두 stressed syllable 사이에 두 stressless syllable이 있으면 그중 한 /ə/가 탈락할 수 있다.",ans:true,correct:"정확하다. respiratory와 glorification은 이 환경에서 /ə/ deletion이 가능한 예다.",why:"Phonological Rules_가루미의 schwa deletion 자료에서 두 stressed syllable 사이의 두 stressless syllable 중 하나는 fast speech에서 탈락할 수 있다. 반면 stressless syllable 하나가 두 stressed syllable 사이에 직접 놓이면 operatic처럼 deletion이 불가능하다.",source:"Phonological Rules_가루미 §3 ① Schwa Deletion",compare:[{title:"가능",desc:"respiratory, glorification: two stressless syllables between stressed syllables"},{title:"불가",desc:"operatic: one stressless syllable directly between stressed syllables"}]}
];
function renderExp(q,isCorrect){
  const three=q.compare&&q.compare.length===3;
  const cmp=q.compare?`<div class="sec-label">📊 비교 정리</div><div class="compare${three?' three':''}">${q.compare.map(c=>`<div class="compare-item"><div class="ci-title">${c.title}</div><p>${c.desc}</p></div>`).join('')}</div>`:'';
  return `<div class="exp show"><div class="exp-header"><span>${isCorrect?'✅ 정답':'❌ 오답'} · 해설</span></div><div class="exp-answer"><div class="ans-label">핵심 정정</div><div class="ans-text">${q.correct}</div></div><div class="exp-body"><div class="sec-label">📖 상세 설명</div><p>${q.why}</p><div class="sec-label">📌 Source</div><div class="def-box"><p>${q.source}</p></div>${cmp}</div></div>`;
}
function renderNav(){
  document.getElementById('nav').innerHTML=answers.map((a,i)=>{
    let cls='nd';
    if(i===cur)cls+=' cur';
    else if(a!==null)cls+=a.correct?' ok':' ng';
    return `<button class="${cls}" onclick="jumpTo(${i})">${i+1}</button>`;
  }).join('');
}
function render(){
  if(cur>=TOTAL){
    document.getElementById('qa').style.display='none';
    document.getElementById('sc').classList.add('show');
    const s=getScore();
    document.getElementById('fs').textContent=s;
    const p=s/TOTAL;
    document.getElementById('rm').textContent=p===1?'🎉 Perfect!':p>=.8?'👏 Great!':p>=.6?'😊 Good!':'💪 Keep going!';
    document.getElementById('rs').textContent=`${TOTAL}문제 중 ${s}문제 정답 (${Math.round(p*100)}%)`;
    setTimeout(function(){window.showScorePopup&&window.showScorePopup(s,TOTAL);},400);
    renderNav();return;
  }
  document.getElementById('sc').classList.remove('show');
  document.getElementById('qa').style.display='block';
  renderNav();
  const q=Q[cur];
  document.getElementById('bf').style.width=((cur+1)/TOTAL*100).toFixed(1)+'%';
  document.getElementById('pt').textContent=`${cur+1} / ${TOTAL}`;
  document.getElementById('ps').textContent=`정답 ${getScore()}개`;
  const a=answers[cur];
  if(a!==null){
    let oBtnCls='',xBtnCls='';
    if(a.picked===true){oBtnCls=a.correct?'co':'wp';if(!a.correct)xBtnCls='cx';}
    else{xBtnCls=a.correct?'cx':'wp';if(!a.correct)oBtnCls='co';}
    document.getElementById('qa').innerHTML=`<div class="card"><div class="q-meta"><span class="q-num">Q${cur+1}</span><span class="q-src">${q.src}</span><span class="q-cat">${q.cat}</span></div><div class="q-text">${q.text}</div><div class="ox-btns"><button class="ox-btn o-btn ${oBtnCls}" disabled>⭕<span class="lb">CORRECT</span></button><button class="ox-btn x-btn ${xBtnCls}" disabled>❌<span class="lb">WRONG</span></button></div><div class="badge ${a.correct?'ok':'ng'}">${a.correct?'✅ 정답!':'❌ 오답! 정답은 '+(q.ans?'O':'X')}</div><div>${renderExp(q,a.correct)}</div><button class="next-btn show" onclick="next()">${cur<TOTAL-1?'Next →':'결과 보기 →'}</button></div>`;
  }else{
    document.getElementById('qa').innerHTML=`<div class="card"><div class="q-meta"><span class="q-num">Q${cur+1}</span><span class="q-src">${q.src}</span><span class="q-cat">${q.cat}</span></div><div class="q-text">${q.text}</div><div class="ox-btns"><button class="ox-btn o-btn" onclick="pick(true)" id="ob">⭕<span class="lb">CORRECT</span></button><button class="ox-btn x-btn" onclick="pick(false)" id="xb">❌<span class="lb">WRONG</span></button></div><div id="bd" class="badge"></div><div id="ep"></div><button class="next-btn" id="nb" onclick="next()">${cur<TOTAL-1?'Next →':'결과 보기 →'}</button></div>`;
  }
}
function pick(val){
  const q=Q[cur];
  document.getElementById('ob').disabled=true;
  document.getElementById('xb').disabled=true;
  const ok=val===q.ans;
  answers[cur]={picked:val,correct:ok};
  if(ok){if(typeof playOk==='function')playOk();}else{if(typeof playNg==='function')playNg();}
  const bd=document.getElementById('bd');
  bd.textContent=ok?'✅ 정답!':`❌ 오답! 정답은 ${q.ans?'O':'X'}`;
  bd.className='badge '+(ok?'ok':'ng');
  document.getElementById(val?'ob':'xb').classList.add(ok?(val?'co':'cx'):'wp');
  if(!ok)document.getElementById(q.ans?'ob':'xb').classList.add(q.ans?'co':'cx');
  document.getElementById('ep').innerHTML=renderExp(q,ok);
  document.getElementById('nb').classList.add('show');
  document.getElementById('ps').textContent=`정답 ${getScore()}개`;
  renderNav();saveProgress();
}
function next(){cur++;saveProgress();render();}
function jumpTo(i){cur=i;render();document.getElementById('qa').scrollIntoView({behavior:'smooth',block:'start'});}
function saveProgress(){localStorage.setItem(SAVE_KEY,JSON.stringify({cur,answers}));}
function freshStart(){localStorage.removeItem(SAVE_KEY);cur=0;answers=new Array(TOTAL).fill(null);document.getElementById('rb').style.display='none';document.getElementById('sc').classList.remove('show');document.getElementById('qa').style.display='block';renderNav();render();}
(function(){
  const saved=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');
  if(saved&&saved.answers&&saved.cur>=0&&saved.cur<TOTAL){
    cur=saved.cur;answers=saved.answers;
    const done=answers.filter(a=>a!==null).length;
    if(done>0){document.getElementById('rb-msg').textContent=`이어서 풀기 중 · ${done}/${TOTAL} 문제 완료 (정답 ${getScore()}개)`;document.getElementById('rb').style.display='block';}
  }
  renderNav();render();
})();
</script>
</body>
</html>
