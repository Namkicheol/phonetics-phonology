<script>
// Previous phono_stress_q28 data is retained; revised scopes use a separate version.
const SAVE_KEY='phono_stress_q28_v2';
const TOTAL=28;
let cur=0,answers=new Array(TOTAL).fill(null);

const Q=[
  {
    "src": "IPA 표기법",
    "cat": "Basics",
    "text": "IPA에서 강세 기호 <span class='kw1'>ˈ</span>(primary)와 <span class='kw1'>ˌ</span>(secondary)는 강세를 받는 음절의 <b>뒤</b>에 표기한다.",
    "ans": false,
    "correct": "강세 기호는 해당 음절의 <span class='kw2'>앞</span>에 온다. 예: <span class='kw1'>/ˈfoʊtəgræf/</span> — ˈ는 강세 받는 음절 <b>시작 앞</b>에 위치.",
    "why": "IPA convention: stress mark precedes the syllable it belongs to. 철자 <b>뒤</b>에 어포스트로피처럼 쓰는 것은 잘못된 표기. 예: fo'tograph (×) → /ˈfoʊtəgræf/ (○)",
    "source": "Mehmet Yavaş, Applied English Phonology, 2nd ed. (2011), Ch. 7."
  },
  {
    "src": "강세 3단계",
    "cat": "Basics",
    "text": "<span class='kw1'>Secondary stress(ˌ)</span>를 받는 음절과 <span class='kw2'>unstressed</span> 음절은 강세의 세기가 동일하다.",
    "ans": false,
    "correct": "Secondary stress와 unstressed는 구분한다. AEP의 분석에서는 secondary-stressed syllable도 +stress이다.",
    "why": "AEP §7.4에서는 primary와 secondary의 차이를 주요 pitch change, 즉 tonic accent의 유무로 설명한다. 따라서 세 단계를 단순한 물리적 세기의 순서로만 읽지 않는다.",
    "compare": [
      {
        "title": "Primary",
        "desc": "+stress, +tonic accent, +full vowel"
      },
      {
        "title": "Secondary",
        "desc": "+stress, −tonic accent, +full vowel"
      },
      {
        "title": "Unstressed",
        "desc": "−stress, −tonic accent; full vowel 유무는 별도 확인"
      }
    ],
    "source": "Mehmet Yavaş, Applied English Phonology, 2nd ed. (2011), Ch. 7."
  },
  {
    "src": "Primary stress 개수",
    "cat": "Basics",
    "text": "이 단원의 단독 발음으로 제시된 content word에는 primary stress 하나를 표시하며, secondary stress는 없을 수도 있다.",
    "ans": true,
    "correct": "단독 발음의 primary stress와 문장 안에서의 prominence를 구분한다.",
    "why": "Dog에는 primary stress만, photographic에는 primary stress와 secondary stress를 표시할 수 있다. 이 설명을 weak form으로 쓰인 function word를 포함한 모든 발화에 그대로 적용하지 않는다.",
    "source": "Mehmet Yavaş, Applied English Phonology, 2nd ed. (2011), Ch. 7."
  },
  {
    "src": "Schwa 실현 환경",
    "cat": "Basics",
    "text": "이 단원에서 사용하는 AEP의 schwa /ə/는 unstressed syllable의 vowel이며, primary-stressed syllable의 vowel로 쓰지 않는다.",
    "ans": true,
    "correct": "Schwa는 비강세 환경에서만 출현. <span class='kw2'>강세 음절</span>에는 full vowel(/æ/, /eɪ/, /oʊ/ 등)이 유지됨.",
    "why": "예: <span class='kw1'>photograph /ˈfoʊtəgræf/</span> — 첫 음절 ˈfoʊ에는 /oʊ/, 비강세 두 번째 음절은 /ə/. 강세 이동 시 약화 위치도 이동: phoˈtography /fəˈtɒgrəfi/ — 이번엔 첫 음절 /fə/.",
    "source": "Mehmet Yavaş, Applied English Phonology, 2nd ed. (2011), Ch. 7."
  },
  {
    "src": "Heavy/Light Syllable 정의",
    "cat": "Heavy/Light",
    "text": "AEP의 이 단원에서는 long vowel·diphthong을 포함하거나, non-schwa short vowel 뒤에 coda가 있는 syllable을 heavy로 분류한다.",
    "ans": true,
    "correct": "Heavy = 장모음/이중모음 OR schwa가 아닌 단모음 + 코다(closed syllable). Light = schwa가 아닌 단모음 + 개음절(no coda); schwa는 weightless이다.",
    "why": "예: <span class='kw1'>beat</span> /biːt/ — 장모음 → heavy. <span class='kw1'>bit</span> /bɪt/ — schwa가 아닌 단모음 + coda /t/ → heavy. <span class='kw2'>bi</span> /bɪ/ — 단모음, coda 없음 → light. [ə]는 이 분류에서 weightless 예외로 다룬다.",
    "compare": [
      {
        "title": "<span class='kw1'>Heavy (H)</span>",
        "desc": "장모음·이중모음 OR non-schwa 단모음+coda"
      },
      {
        "title": "<span class='kw2'>Light (L)</span>",
        "desc": "non-schwa 단모음 + coda 없음 (open syllable); schwa는 weightless"
      }
    ],
    "more": "<details><summary>예제로 확인: heavy와 실제 stress 위치는 같은 판단일까?</summary><p>먼저 aˈgenda의 penult /dʒɛn/을 보자. Nucleus /ɛ/ 뒤에 coda /n/이 있으므로 이 단원의 AEP 분석에서 heavy다. 3음절 noun의 기본 패턴을 적용하면 그 penult에 primary stress가 온다. Onset /dʒ/가 복잡해서 heavy인 것은 아니다.</p><p>반면 /ˈkæl.ən.dɚ/로 제시된 calendar는 penult에 coda /n/이 있어도 nucleus가 schwa다. AEP는 이 schwa를 weightless로 취급하므로, 일반적인 non-schwa CVC와 구분한다. /ˈkælɪndər/처럼 다른 vowel이 쓰인 전사에 이 설명을 그대로 옮겨서는 안 된다.</p><p>Heavy라는 말은 syllable 구조에 대한 분류이고, primary stress는 단어 안에서 어느 syllable이 가장 두드러지는지에 대한 표시다. Heavy syllable이 여럿이라고 모두 primary stress를 받는 것은 아니다. 품사, suffix, 예외, 제시된 발음을 함께 확인해야 한다.</p><p>2010 1차 Q33은 schwa가 있는 syllable을 light의 예외적 하위 경우로 포함해 정의한다. 따라서 그 문제를 풀 때 AEP의 weightless라는 이름을 답안에 강제로 대입하지 않는다. 정의가 다르게 제시되면 먼저 그 문제의 분류 기준을 따른다.</p></details>",
    "source": "Mehmet Yavaş, Applied English Phonology, 2nd ed. (2011), Ch. 7."
  },
  {
    "src": "Heavy/Light & Stress",
    "cat": "Heavy/Light",
    "text": "<span class='kw1'>Heavy syllable</span>은 <span class='kw1'>attract stress</span>하고, <span class='kw2'>light syllable</span>은 stress를 받지 않는 경향이 있다.",

    "why": "<span class='kw1'>-ify</span>는 stress-shifting (fixing) suffix로, 접미사 바로 앞 음절에 primary stress를 둔다. i-den-ti-fy에서는 <b>-den-</b>이 <span class='kw1'>-ify</span> 직전 음절이며, 네 음절 중 뒤에서 세 번째인 antepenultimate이기도 하다. <span class='kw1'>ˈpure → ˈpurity</span>(-ity)와 <span class='kw1'>ˈnavigate → naviˈgation</span>(-ion; 2010 기출)은 같은 위치에 강세가 오는 별도 suffix 예시일 뿐, identify의 suffix를 -ity로 바꾸는 근거는 아니다.",
    "more": "<details><summary>예제로 확인: suffix의 종류와 형태적 기능을 함께 보기</summary><p>ˈhappy → ˈhappiness에서는 base의 primary stress가 유지된다. ˈhumid → huˈmidity에서는 -ity 앞 syllable에 primary stress가 온다. ˈlemon → lemonˈade에서는 suffix 자체가 primary stress를 받는다. 각각 neutral, shifting, bearing의 차이를 보여 준다.</p><p>그렇다고 stress 위치가 그대로면 무조건 neutral인 것은 아니다. Abˈsurd → abˈsurdity에서는 -ity가 요구하는 위치에 이미 stress가 있으므로 겉으로 위치가 바뀌지 않는다. 하나의 단어쌍에서 이동이 보이는지와 suffix의 분류를 구분해야 한다.</p><p>같은 -y라도 ˈsilk → ˈsilky의 adjective-forming -y와 ˈphotograph → phoˈtography의 noun-forming -y는 다르게 작용한다. 철자가 같다는 이유만으로 하나의 stress 규칙을 적용하지 않는다.</p><p>2010 1차 Q33은 navigate–navigation의 suffix를 -ion으로 제시한다. AEP는 realize–realization에서 -ation을 bearing으로 분류한다. Suffix로 어디까지 묶었는지가 다르므로, -ion과 -ation을 구분한 뒤 stress를 받는 부분이 suffix 안인지 밖인지 확인한다.</p><p>AEP는 -able의 변이와 momentary–momentarily도 따로 다룬다. 따라서 neutral 목록을 어떤 base에 몇 개가 붙어도 예외가 없는 규칙으로 읽으면 안 된다. 문항에 발음이 제시되었다면 그 발음을 우선한다.</p></details>",
    "source": "Mehmet Yavaş, Applied English Phonology, 2nd ed. (2011), Ch. 7."

function renderExp(q,isCorrect){
  let h=`<div class="exp show"><div class="exp-header"><span>Explanation</span></div><div class="exp-answer"><div class="ans-label">정답 — ${q.ans?'O (correct)':'X (wrong)'}</div><div class="ans-text">${q.correct}</div></div><div class="exp-body">`;
  if(q.why){h+=`<div class="sec-label">Why</div><p>${q.why}</p>`;}
  if(q.source){h+=`<div class="sec-label">Source</div><div class="def-box"><p>${q.source}</p></div>`;}
  if(q.compare&&q.compare.length){
    const cls=q.compare.length===3?'compare three':'compare';
    h+=`<div class="sec-label">Compare</div><div class="${cls}">`;
    q.compare.forEach(c=>{h+=`<div class="compare-item"><div class="ci-title">${c.title}</div><p>${c.desc}</p></div>`;});
    h+=`</div>`;
  }
  if(q.more){h+=q.more;}
  h+=`</div></div>`;
  h+=window.QuizStudyFigures ? window.QuizStudyFigures.render(q) : '';
  return h;
}
function getScore(){return answers.filter(a=>a&&a.correct).length;}
function renderNav(){
  const n=document.getElementById('nav');
  n.innerHTML='';
  answers.forEach((_,i)=>{
    const a=answers[i];
    const cls=i===cur?'nd cur':a===null?'nd':a.correct?'nd ok':'nd ng';
    n.innerHTML+=`<button class="${cls}" onclick="jumpTo(${i})">${i+1}</button>`;
  });
}
function restart(){freshStart();}
function render(){
  if(cur>=TOTAL){
    document.getElementById('qa').style.display='none';
    document.getElementById('sc').classList.add('show');
    const s=getScore();
    document.getElementById('fs').textContent=s;
    const p=s/TOTAL;
    document.getElementById('rm').textContent=p===1?'🎉 Perfect!':p>=.8?'👏 Great!':p>=.6?'😊 Good!':'💪 Keep going!';
    document.getElementById('rs').textContent=`${TOTAL}문제 중 ${s}문제 정답 (${Math.round(p*100)}%)`;
    quizOrder.resultLater(()=>{if(cur>=TOTAL)window.showScorePopup&&window.showScorePopup(s,TOTAL);});
    renderNav();return;
  }
  document.getElementById('sc').classList.remove('show');
  document.getElementById('qa').style.display='block';
  renderNav();
  const q=Q[cur];
  document.getElementById('bf').style.width=((cur+1)/TOTAL*100).toFixed(1)+'%';
  document.getElementById('pt').textContent=`${cur+1} / ${TOTAL}`;
  document.getElementById('ps').textContent=`정답 ${getScore()}개`;
  const a=answers[cur];
  if(a!==null){
    let oc='',xc='';
    if(a.picked===true){oc=a.correct?'co':'wp';if(!a.correct)xc='cx';}
    else{xc=a.correct?'cx':'wp';if(!a.correct)oc='co';}
    document.getElementById('qa').innerHTML=`<div class="card"><div class="q-meta"><span class="q-num">Q${cur+1}</span><span class="q-src">${q.src}</span><span class="q-cat">${q.cat}</span></div><div class="q-text">${q.text}</div><div class="ox-btns"><button class="ox-btn o-btn ${oc}" disabled>⭕<span class="lb">CORRECT</span></button><button class="ox-btn x-btn ${xc}" disabled>❌<span class="lb">WRONG</span></button></div><div class="badge ${a.correct?'ok':'ng'}">${a.correct?'✅ 정답!':'❌ 오답! 정답은 '+(q.ans?'O':'X')}</div><div>${renderExp(q,a.correct)}</div><button class="next-btn show" onclick="next()">${cur<TOTAL-1?'Next →':'결과 보기 →'}</button></div>`;
  }else{
    document.getElementById('qa').innerHTML=`<div class="card"><div class="q-meta"><span class="q-num">Q${cur+1}</span><span class="q-src">${q.src}</span><span class="q-cat">${q.cat}</span></div><div class="q-text">${q.text}</div><div class="ox-btns"><button class="ox-btn o-btn" onclick="pick(true)" id="ob">⭕<span class="lb">CORRECT</span></button><button class="ox-btn x-btn" onclick="pick(false)" id="xb">❌<span class="lb">WRONG</span></button></div><div id="bd" class="badge"></div><div id="ep"></div><button class="next-btn" id="nb" onclick="next()">${cur<TOTAL-1?'Next →':'결과 보기 →'}</button></div>`;
  }
}
function pick(val){
  const q=Q[cur];
  document.getElementById('ob').disabled=true;
  document.getElementById('xb').disabled=true;
  const ok=val===q.ans;
  answers[cur]={picked:val,correct:ok};
  if(ok){if(typeof playOk==='function')playOk();}else{if(typeof playNg==='function')playNg();}
  const bd=document.getElementById('bd');
  bd.textContent=ok?'✅ 정답!':`❌ 오답! 정답은 ${q.ans?'O':'X'}`;
  bd.className='badge '+(ok?'ok':'ng');
  document.getElementById(val?'ob':'xb').classList.add(ok?(val?'co':'cx'):'wp');
  if(!ok)document.getElementById(q.ans?'ob':'xb').classList.add(q.ans?'co':'cx');
  document.getElementById('ep').innerHTML=renderExp(q,ok);
  document.getElementById('nb').classList.add('show');
  document.getElementById('ps').textContent=`정답 ${getScore()}개`;
  renderNav();saveProgress();
}
function next(){cur++;saveProgress();render();}
function jumpTo(i){cur=i;render();document.getElementById('qa').scrollIntoView({behavior:'smooth',block:'start'});}
function saveProgress(){quizOrder.save({cur,answers});}
function freshStart(){quizOrder.reset();cur=0;answers=new Array(TOTAL).fill(null);document.getElementById('rb').style.display='none';document.getElementById('sc').classList.remove('show');document.getElementById('qa').style.display='block';renderNav();render();saveProgress();}
const quizOrder=QuizOrder.create(Q,{saveKey:SAVE_KEY,restart:freshStart});
(function(){
  const saved=quizOrder.progress;
  if(saved&&saved.answers&&saved.cur>=0&&saved.cur<TOTAL){
    cur=saved.cur;answers=saved.answers;
    const done=answers.filter(a=>a!==null).length;
    if(done>0){document.getElementById('rb-msg').textContent=`이어서 풀기 중 · ${done}/${TOTAL} 문제 완료 (정답 ${getScore()}개)`;document.getElementById('rb').style.display='block';}
  }
  renderNav();render();saveProgress();
})();
</script>
